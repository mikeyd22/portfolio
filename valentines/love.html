<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you be my Valentine</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
</head>
<body class="love-page">
  <div id="snow" class="snow" aria-hidden="true"></div>
  <img id="snowboarder" class="snowboarder-follow" src="images/snowboarder.png?v=5" alt="" aria-hidden="true">

  <main>
    <h1 class="page-title">Will you be my Valentine?</h1>

    <section class="section">
      <h2 class="section-title">To Chloe:</h2>
      <p>Happy Valentine's Day Chloe! You're my favorite person, my
         best friend, and the one I want by my side for all the Valentine's Days to come.</p>
      <p class="highlight">love you always</p>
    </section>

    <section class="section">
      <h2 class="section-title">Favourite memories</h2>

      <div class="gallery-row">
        <img src="images/memory-1.png" alt="Memory from the slopes" class="placeholder-img gallery">
        <img src="images/memory-2.png" alt="Night on the mountain" class="placeholder-img gallery">
        <img src="images/memory-3.png" alt="Sunset on the slopes" class="placeholder-img gallery">
      </div>
    </section>

    <section class="section section-end">
      <h2 class="section-title">Happy Valentine's Day</h2>
      <p class="highlight">♥ I love you ♥</p>
      <img src="images/valentines.png" alt="Michael & Chloe — 2026 Valentines" class="valentines-pic">
    </section>

    <a href="index.html" class="back-link">← Back to top</a>
  </main>

  <script src="script.js"></script>
</body>
</html>
